name: Official Source Validation

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Vancouver publication date used to count matching entries"
        required: true
        default: "2026-09-17"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Validate BC and Vancouver official feeds
        run: >-
          python scripts/pipeline.py
          --date "${{ github.event.inputs.date }}"
          --validate-source bc_news
          --validate-source vancouver_news
