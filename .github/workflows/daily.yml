name: Daily News Pipeline

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Publication date in Vancouver time, for example 2026-09-13"
        required: false
      publish:
        description: "Upload generated files to Cloudflare R2 and deploy Worker"
        type: boolean
        default: false
  schedule:
    - cron: "17 12,14,16,18,20,22 * * *"

concurrency:
  group: infogap-daily-publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  freshness:
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.check.outputs.needed }}
      date: ${{ steps.check.outputs.date }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: check
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: python scripts/publication.py check --date "$INPUT_DATE"

  generate:
    needs: freshness
    if: needs.freshness.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NEWS_TIMEZONE: America/Vancouver
      NEWS_RETENTION_DAYS: "5"
      LLM_PRIMARY_MODEL: deepseek-chat
      LLM_REVIEW_MODEL: gemini-3.5-flash-lite
      TTS_VOICE: cmn-CN-Chirp3-HD-Achernar
      TTS_FALLBACK_VOICE: cmn-CN-Wavenet-A
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_AI_API }}
      GOOGLE_CLOUD_PROJECT_ID: ${{ secrets.GOOGLE_CLOUD_PROJECT_ID }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      GOOGLE_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
      HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore run history
        uses: actions/cache@v4
        with:
          path: runs
          key: infogap-runs-${{ github.run_id }}
          restore-keys: |
            infogap-recovery-
            infogap-runs-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - id: google-auth-wif
        if: ${{ env.GOOGLE_WORKLOAD_IDENTITY_PROVIDER != '' }}
        uses: google-github-actions/auth@v2
        with:
          create_credentials_file: true
          workload_identity_provider: ${{ env.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
      - id: google-auth-json
        if: ${{ env.GOOGLE_WORKLOAD_IDENTITY_PROVIDER == '' && env.GOOGLE_APPLICATION_CREDENTIALS_JSON != '' }}
        uses: google-github-actions/auth@v2
        with:
          create_credentials_file: true
          credentials_json: ${{ env.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      - run: python -m pip install -r requirements.txt
      - run: npm install
      - run: npm test
      - run: python -m unittest discover -s tests
      - run: python scripts/check_config.py --mode daily
      - name: Generate and evidence-review site (automatic retry)
        env:
          PUBLICATION_DATE: ${{ needs.freshness.outputs.date }}
        shell: bash
        run: |
          for attempt in 1 2; do
            if python scripts/pipeline.py --date "$PUBLICATION_DATE" --use-llm --review --tts; then
              exit 0
            fi
            if [ "$attempt" -eq 1 ]; then sleep 20; fi
          done
          exit 1
      - name: Prepare published-source ledger
        env:
          PUBLICATION_DATE: ${{ needs.freshness.outputs.date }}
        run: python scripts/publication.py ledger --date "$PUBLICATION_DATE"
      - name: Upload generated site for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-site
          path: |
            generated/
            runs/
          retention-days: 7
      - name: Deploy Worker
        if: github.event_name == 'schedule' || github.event.inputs.publish == 'true'
        run: npx wrangler deploy
      - name: Upload generated site to R2
        if: github.event_name == 'schedule' || github.event.inputs.publish == 'true'
        shell: bash
        run: |
          find generated/site -type f ! -path 'generated/site/index.html' ! -path 'generated/site/data/index.json' ! -path 'generated/site/data/publication-history.json' -print0 | while IFS= read -r -d '' file; do
            key="${file#generated/site/}"
            npx wrangler r2 object put "${CLOUDFLARE_R2_BUCKET}/site/${key}" --file "$file" --remote
          done
          for key in data/publication-history.json data/index.json index.html; do
            npx wrangler r2 object put "${CLOUDFLARE_R2_BUCKET}/site/${key}" --file "generated/site/${key}" --remote
          done
      - name: Mark successful publication
        if: github.event_name == 'schedule' || github.event.inputs.publish == 'true'
        env:
          PUBLICATION_DATE: ${{ needs.freshness.outputs.date }}
        run: python scripts/publication.py mark --date "$PUBLICATION_DATE"
      - name: Save recovery history even after failure
        if: always()
        uses: actions/cache/save@v4
        with:
          path: runs
          key: infogap-recovery-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Ping Healthchecks success
        if: success()
        run: python -c "import os, requests; url=os.getenv('HEALTHCHECKS_PING_URL'); requests.get(url + '/0', timeout=20) if url else None"
      - name: Ping Healthchecks failure
        if: failure()
        run: python -c "import os, requests; url=os.getenv('HEALTHCHECKS_PING_URL'); requests.get(url + '/fail', timeout=20) if url else None"
